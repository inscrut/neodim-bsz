# Основные настройки проекта
site_name: Проект Неодим БСЗ - переделка систем зажигания
site_url: https://bsz.neodim.tech/
site_description: >-
  Неодим БСЗ - переделка с контактной на бесконтактную систему зажигания с сохранением заводских характеристик угла опережения зажигания ( УОЗ ).
site_author: inscrut

# Фрагменты для pymdownx.snippets — не отдельные страницы в сборке
exclude_docs: |
  snippets/*.md

# Правовые страницы доступны по URL, но живут только в футере (не в основной навигации)
not_in_nav: |
  legal/*.md

# Copyright
copyright: Copyright &copy; 2026 Неодим Технология

# Тема и оформление
theme:
  name: material
  language: ru
  favicon: https://neodim.tech/tremblor.png
  logo: https://neodim.tech/tremblor.png

  custom_dir: overrides/

  icon:
    logo: material/server-network
    repo: fontawesome/brands/git-alt

  features:
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.prune
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Тёмная тема

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

extra_css:
  - stylesheets/extra.css

# Плагины
plugins:
  - search:
      lang:
        - ru
        - en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - glightbox:
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom
  - git-revision-date-localized:
      enable_creation_date: false
      type: datetime
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - meta: {}
  - redirects:
      redirect_maps:
        # Перенос раздела «Схемы БСЗ» → «Руководство»
        theory/build-circuit.md: guide/build-circuit.md
        # Перенос «Настройка и диагностика» → «Руководство»
        service/bsz-check-algorithm.md: guide/bsz-check-algorithm.md
        service/ignition-timing.md: guide/ignition-timing.md
        service/problems-and-solutions.md: guide/problems-and-solutions.md
        # Перенос текстовых инструкций → «Руководство»
        instructions/video-tachometer-connection.md: guide/tachometer-connection.md
        instructions/video-hall-sensor-mod.md: guide/hall-sensor-mod.md
        # Удалённые страницы-заглушки с VK-виджетами → страницы соответствующих наборов
        instructions/video-install-zaz-luaz-new.md: kits/zaz-luaz.md
        instructions/video-install-zaz-luaz-old.md: kits/zaz-luaz.md
        instructions/video-install-izh-moskvich.md: kits/izh-moskvich-azlk.md
        instructions/video-install-gaz-uaz.md: kits/gaz-uaz.md
        instructions/video-install-vaz-303706.md: kits/vaz.md
        instructions/video-install-vaz-403706.md: kits/vaz.md
        instructions/video-install-zil-v8.md: kits/zil-gaz-v8.md

# Markdown расширения
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      repo: gfdocs
      user: inscrut
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Дополнительно
extra:
  consent:
    title: Согласие на cookies
    description: >-
      Мы используем cookies только для аналитики и улучшения работы сайта.
    actions:
      - accept
      - manage

  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/bszkit_chat
    - icon: fontawesome/brands/telegram
      link: https://t.me/bszkit
    - icon: fontawesome/brands/telegram
      link: https://t.me/neodim_workshop

  generator: false

# Навигация
nav:
  - Главная: index.md
  - С чего начать: 
      - guide/index.md
      - Теория БСЗ: 
          - theory/index.md
          - Одноконтурное БСЗ: theory/single-circuit.md
          - Двухконтурное БСЗ: theory/dual-circuit.md
          - Трёхконтурное БСЗ: theory/three-circuit.md
          - Четырёхконтурное БСЗ: theory/four-circuit.md
  - Руководство:
      - Сборка системы по схеме: guide/build-circuit.md
      - Подключение тахометра (два контура): guide/tachometer-connection.md
      - Алгоритм проверки БСЗ: guide/bsz-check-algorithm.md
      - Настройка момента зажигания: guide/ignition-timing.md
      - Доработка датчика Холла: guide/hall-sensor-mod.md
      - Проблемы и решения: guide/problems-and-solutions.md
  - Наборы БСЗ Неодим:
