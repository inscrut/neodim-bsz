      - Как определить комплект: kits/how-to-choose-kit.md
      - Модели автомобилей:
          - ЗАЗ / ЛуАЗ: kits/zaz-luaz.md
          - Иж / Москвич / АЗЛК: kits/izh-moskvich-azlk.md
          - ГАЗ / УАЗ: kits/gaz-uaz.md
          - "ГАЗ (6 цил.)": kits/gaz-v6.md
          - ВАЗ: kits/vaz.md
          - ЗИЛ / ГАЗ (8 цил.): kits/zil-gaz-v8.md
          - Nissan: kits/nissan.md
      - Распределители зажигания:
          - distributors/index.md
          - "Р-107, Р-118, Р-114": distributors/distributor-r114.md
          - 17.3706: distributors/distributor-173706.md
          - Р-147: distributors/distributor-r147.md
          - 4701.3706: distributors/distributor-47013706.md
          - 4708.3706: distributors/distributor-47083706.md
          - "30.3706, 3810.3706": distributors/distributor-303706-3810.md
          - 40.3706: distributors/distributor-403706.md
          - "1908.3706, 3312.3706": distributors/distributor-1908-3312.md
          - "23.3706, 2301.3706": distributors/distributor-233706-2301.md
          - "24.3706, 24.3706а": distributors/distributor-243706.md
          - "2402.3706, 2402.3706-10": distributors/distributor-2402.md
          - Р133-01: distributors/distributor-r133-01.md
          - D4R87-07: distributors/distributor-d4r87-07.md
      - Дополнительные товары: kits/ozon-other.md
  - Компоненты:
      - components/index.md
      - Типовой список для сборки БСЗ: components/buy-list.md
      - Датчик Холла: components/hall-sensor.md
      - Катушки зажигания: components/ignition-coils.md
      - Жгут проводки БСЗ: components/wiring-harness-dbsz.md
      - Коммутатор 76.3774: components/commutator-763774.md
      - МД-1: components/md-1.md
  - Видео-архив: videos/index.md
  - Контакты: contact.md
  - О нас: about.md
